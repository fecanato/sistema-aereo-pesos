.scanner .stepin{overflow-y:auto}.scanner .photo-scan{margin:7px 0;flex-shrink:0}.scanner .camera-box{flex-shrink:0}.scanner .scan-actions{flex-shrink:0}.scanner .camera-status{min-height:36px}

/* === 8 Improvements: Destination History, Edit in Modals, Search/Filter, Swipe Tabs, Category Colors, Dark Mode === */
.dest-row{width:100%;text-align:left;background:transparent;color:inherit;cursor:pointer;border-radius:12px;padding:16px 10px;margin:0 -10px;width:calc(100% + 20px);transition:background .15s}
.dest-row:hover{background:#f4effb}
.dest-row:focus-visible{outline:3px solid var(--purple);outline-offset:2px}
.dest-row-hint{display:inline-block;margin-top:4px;font-size:11px;font-weight:600;color:var(--purple)}
.dest-detail-summary{margin-top:6px;font-size:12px;color:var(--muted);font-weight:500;display:flex;flex-wrap:wrap;gap:6px}

/* Category Color Badges */
.cat-badge{display:inline-flex;align-items:center;padding:2px 7px;border-radius:6px;font-size:11px;font-weight:700;letter-spacing:.3px}
.cat-CAIXA{background:#dbeafe;color:#1d4ed8}
.cat-SACA{background:#dcfce7;color:#15803d}
.cat-DG{background:#fee2e2;color:#b91c1c}
.cat-PALLET{background:#ede9fe;color:#6d28d9}
.cat-DELIVERY{background:#fef3c7;color:#b45309}
.cat-COMAIL{background:#ccfbf1;color:#0f766e}
.cat-SEM_CLASSIFICACAO{background:#f0eef4;color:#6b6675}

.special-stat[data-special-kind="DG"]{border-left:4px solid #dc2626}
.special-stat[data-special-kind="DG"]>span{color:#b91c1c}
.special-stat[data-special-kind="PALLET"]{border-left:4px solid #7c3aed}
.special-stat[data-special-kind="PALLET"]>span{color:#6d28d9}
.special-stat[data-special-kind="DELIVERY"]{border-left:4px solid #d97706}
.special-stat[data-special-kind="DELIVERY"]>span{color:#b45309}
.special-stat[data-special-kind="COMAIL"]{border-left:4px solid #0d9488}
.special-stat[data-special-kind="COMAIL"]>span{color:#0f766e}

#insertdg{background:#fee2e2;color:#b91c1c}
#insertPallet{background:#ede9fe;color:#6d28d9}
#insertDelivery{background:#fef3c7;color:#b45309}
#insertComail{background:#ccfbf1;color:#0f766e}
.special-types{grid-template-columns:repeat(auto-fit,minmax(76px,1fr))!important}
.stats.special-stats{grid-template-columns:repeat(auto-fit,minmax(120px,1fr))!important}

/* Modal row actions */
.modal-row-actions{display:flex;align-items:center;gap:4px;flex-shrink:0}

/* Search & filter bar in Últimos lançamentos */
.filter-bar{margin-bottom:14px;display:flex;flex-direction:column;gap:8px}
.filter-search{padding:11px 14px;font-size:14px;border-radius:10px}
.filter-chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.filter-chips::-webkit-scrollbar{display:none}
.filter-chip{padding:6px 10px;border-radius:8px;font-size:11px;font-weight:700;background:#f2eff7;color:var(--muted);white-space:nowrap;border:1px solid transparent}
.filter-chip.active{background:var(--purple);color:white}

/* Swipeable Board Tabs (Totais por destino <-> Últimos lançamentos) */
.board-switcher{display:none;margin:18px 0 8px}
.board-tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:#e8e4f0;padding:4px;border-radius:13px}
.board-tab{padding:11px 10px;border-radius:10px;font-size:13px;font-weight:700;background:transparent;color:var(--muted);text-align:center}
.board-tab.active{background:white;color:var(--purple);box-shadow:0 2px 8px #0001}
.swipe-hint{text-align:center;font-size:11px;color:var(--muted);margin-top:6px}
@media(max-width:760px){
  .board-switcher{display:block}
  .grid.swipe-grid{display:block;margin-top:8px}
  .grid.swipe-grid>.board-panel.hidden-mobile{display:none}
}

/* Theme toggle button */
.theme-toggle{width:36px;height:36px;border-radius:10px;background:var(--light);color:var(--purple);display:grid;place-items:center;font-size:16px;padding:0}

/* Padronização de Fundo em Tela Cheia (sem faixa branca no login ou operações) */
html,body{min-height:100vh;min-height:100dvh;margin:0;background:#f8fafc;color:#0f172a}
html.dark,body.dark,html:has(body.dark){background:#0f172a;color:#f1f5f9}
#app{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
.shell{max-width:1100px;width:100%;margin:0 auto;padding:24px 24px 60px;flex:1}
.login{max-width:450px;width:100%;margin:4vh auto}

/* Suite Top Header Bar (Padronizado Suíte Sistema Aéreo - Módulo Gestão de Pesos Esmeralda) */
.suite-topbar{background:#ffffff;border-bottom:1px solid #e2e8f0;position:sticky;top:0;z-index:50;transition:background .2s,border-color .2s}
.suite-topbar-inner{max-width:1280px;margin:0 auto;padding:0 16px;height:64px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.suite-brand-wrap{display:flex;align-items:center;gap:14px;min-width:0;flex-shrink:0}
.suite-brand{display:flex;align-items:center;gap:10px;cursor:pointer;text-decoration:none;color:inherit;flex-shrink:0}
.suite-logo-box{width:32px;height:32px;border-radius:8px;background:#059669;display:flex;align-items:center;justify-content:center;color:white;box-shadow:0 1px 2px rgba(0,0,0,.08);flex-shrink:0}
.suite-brand-title{font-size:14px;font-weight:700;color:#0f172a;line-height:1.2;margin:0;white-space:nowrap}
.suite-brand-sub{font-size:10px;font-weight:700;color:#059669;margin:1px 0 0;letter-spacing:.1px;white-space:nowrap}
.suite-op-pill{display:inline-flex;align-items:center;padding:4px 10px;border-radius:6px;background:#ecfdf5;color:#047857;border:1px solid #a7f3d0;font-size:12px;font-weight:700;white-space:nowrap}

/* Centro do Cabeçalho: Logo FedEx Linehaul */
.suite-center-logo{flex:1;display:flex;align-items:center;justify-content:center;user-select:none;pointer-events:none;padding:0 6px;min-width:0}
.fedex-linehaul-pill{display:inline-flex;align-items:center;gap:10px;padding:4px 14px;border-radius:12px;background:rgba(248,250,252,0.85);border:1px solid rgba(226,232,240,0.8);box-shadow:0 1px 2px rgba(0,0,0,0.03);white-space:nowrap}
.fedex-wordmark{display:flex;align-items:baseline;letter-spacing:-0.05em;line-height:1;font-weight:900;font-size:20px;font-family:'Inter','Arial Black',sans-serif}
.fedex-fed{color:#4D148C}
.fedex-ex{color:#FF6200;margin-left:-0.5px}
.fedex-divider{height:16px;width:1.5px;background:#cbd5e1;border-radius:999px;flex-shrink:0}
.fedex-sub{display:flex;align-items:center;gap:6px}
.fedex-plane{width:14px;height:14px;color:#FF6200;flex-shrink:0}
.fedex-linehaul-text{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:0.22em;color:#334155}

.suite-actions{display:flex;align-items:center;gap:10px;flex-shrink:0}
.suite-icon-btn{width:34px;height:34px;border-radius:12px;background:#f1f5f9;color:#475569;display:inline-flex;align-items:center;justify-content:center;font-size:15px;padding:0;transition:background .15s,color .15s;flex-shrink:0}
.suite-icon-btn:hover{background:#e2e8f0;color:#0f172a}
.suite-user-info{display:flex;align-items:center;gap:8px;margin-right:2px}
.suite-user-name{font-size:12px;font-weight:700;color:#334155;text-transform:uppercase;white-space:nowrap}
.suite-logout-btn{background:none;border:0;padding:4px;color:#94a3b8;display:inline-flex;align-items:center;justify-content:center;border-radius:8px;transition:color .15s,background .15s}
.suite-logout-btn:hover{color:#f43f5e;background:rgba(244,63,94,0.08)}

/* Abas da Tela de Operações no padrão Controle Operacional e Gestão de Minutas */
.tabs{display:flex;align-items:center;gap:16px;margin:24px 0 18px;border-bottom:1px solid #e2e8f0;padding-bottom:8px}
.tabs button{padding:0 0 8px 0;margin-bottom:-9px;border-radius:0;background:transparent;color:#64748b;font-size:14px;font-weight:700;border-bottom:2px solid transparent;transition:color .15s,border-color .15s}
.tabs button:hover:not(.active){color:#334155}
.tabs button.active{background:transparent;color:#059669;border-bottom:2px solid #059669}
.tabs button.tab-reload-btn{padding:2px 6px;margin-bottom:-4px;border:0;color:#94a3b8;font-size:15px;border-radius:8px}
.tabs button.tab-reload-btn:hover{color:#059669;background:rgba(16,185,129,0.08)}

/* Cards de Histórico com botões Reabrir Operação (verde no tema) e Consultar -> */
.op-history-card{cursor:default;flex-wrap:wrap;gap:12px;padding:20px 24px}
.op-history-info{cursor:pointer;flex:1;min-width:200px}
.op-history-info strong{display:block;font-size:18px;margin:0 0 4px}
.op-history-actions{display:flex;align-items:center;gap:8px;flex-shrink:0}
.btn-reopen-op{padding:8px 16px;border-radius:12px;background:rgba(16,185,129,0.12);color:#059669;font-size:12px;font-weight:700;transition:background .15s;white-space:nowrap}
.btn-reopen-op:hover{background:rgba(16,185,129,0.22)}
.btn-consult-op{padding:8px 12px;border-radius:12px;background:#f1f5f9;color:#334155;font-size:12px;font-weight:700;transition:background .15s;white-space:nowrap}
.btn-consult-op:hover{background:#e2e8f0}

@media(max-width:650px){
  .suite-topbar-inner{padding:0 10px;gap:6px;height:58px}
  .suite-brand{gap:8px}
  .suite-logo-box{width:28px;height:28px;border-radius:7px}
  .suite-brand-title{font-size:12px}
  .suite-brand-sub{font-size:9px}
  .suite-op-pill{display:none}
  .suite-center-logo{padding:0 2px}
  .fedex-linehaul-pill{padding:3px 8px;gap:6px;border-radius:9px}
  .fedex-wordmark{font-size:15px}
  .fedex-divider{height:12px}
  .fedex-plane{width:11px;height:11px}
  .fedex-linehaul-text{font-size:9px;letter-spacing:0.14em}
  .suite-actions{gap:6px}
  .suite-icon-btn{width:30px;height:30px;border-radius:10px}
  .suite-user-name{font-size:11px;max-width:68px;overflow:hidden;text-overflow:ellipsis}
  .op-history-card{padding:18px}
  .op-history-actions{width:100%;justify-content:flex-end}
}
@media(max-width:390px){
  .suite-user-name{display:none}
}

<script>
/* Same-origin free decoder, also available without Web Workers. */
window.AwbDecode={
  ready:null,
  async load(){
    if(!this.ready)this.ready=(async()=>{
      
      await ZXingWASM.prepareZXingModule({fireImmediately:true});
    })().catch(e=>{this.ready=null;throw e});
    return this.ready;
  },
  async read(image,minLineCount=2){await this.load();for(const binarizer of ['LocalAverage','FixedThreshold']){const results=await ZXingWASM.readBarcodes(image,{formats:['Code128'],tryHarder:true,tryRotate:true,tryInvert:true,tryDownscale:true,minLineCount,maxNumberOfSymbols:8,binarizer});const valid=results.filter(r=>!r.error).map(r=>r.text);if(valid.length)return valid}return []},
  async photo(file){
    const url=URL.createObjectURL(file),img=new Image();
    try{await new Promise((resolve,reject)=>{img.onload=resolve;img.onerror=()=>reject(Error('Não consegui abrir a foto. Tente tirar outra foto da etiqueta.'));img.src=url});
      const canvas=document.createElement('canvas'),ctx=canvas.getContext('2d',{willReadFrequently:true});const scale=Math.min(1,3000/Math.max(img.naturalWidth,img.naturalHeight));canvas.width=Math.round(img.naturalWidth*scale);canvas.height=Math.round(img.naturalHeight*scale);ctx.drawImage(img,0,0,canvas.width,canvas.height);
      return await this.read(ctx.getImageData(0,0,canvas.width,canvas.height));
    }finally{URL.revokeObjectURL(url)}
  }
};

/* Camera capture and sequential worker decoding; no frames leave the device. */

  async start(){
    try{

      if(this.workerUrl){URL.revokeObjectURL(this.workerUrl);this.workerUrl=null}
      this.workerUrl=URL.createObjectURL(new Blob([workerSrc],{type:'application/javascript'}));
      this.worker=new Worker(this.workerUrl);

      this.worker.onerror=()=>this.useDirect();

    }catch{this.useDirect()}
    await this.openCamera();
  }
  async openCamera(id){
    const generation=(this.generation||0)+1;this.generation=generation;
    this.stream?.getTracks().forEach(t=>t.stop());this.stream=null;
    const video=id?{deviceId:{exact:id},width:{ideal:1920},height:{ideal:1080}}:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1080}};

    await this.makeControls(track,caps);if(this.stopped)return;this.onStatus('Câmera aberta. Preparando a análise da imagem…');this.schedule();
  }
  async makeControls(track,caps){
    this.controls.replaceChildren();
    if(caps.torch){const b=document.createElement('button');b.className='secondary';b.textContent='Lanterna';b.type='button';let enabled=false;b.onclick=async()=>{try{await track.applyConstraints({advanced:[{torch:!enabled}]});enabled=!enabled;b.textContent=enabled?'Apagar lanterna':'Lanterna'}catch{this.onStatus('Lanterna indisponível nesta câmera.')}};this.controls.append(b)}
    if(caps.zoom&&caps.zoom.max>caps.zoom.min){const label=document.createElement('label');label.textContent='Zoom ';const input=document.createElement('input');input.type='range';input.min=caps.zoom.min;input.max=Math.min(caps.zoom.max,4);input.step=caps.zoom.step||0.1;input.value=track.getSettings().zoom||caps.zoom.min;input.setAttribute('aria-label','Zoom da câmera');input.onchange=()=>track.applyConstraints({advanced:[{zoom:Number(input.value)}]}).catch(()=>this.onStatus('Zoom indisponível.'));label.append(input);this.controls.append(label)}

  }
  async useDirect(){if(this.stopped||this.direct)return;this.direct=true;this.ready=false;this.busy=false;clearTimeout(this.timeout);clearTimeout(this.watchdog);this.worker?.terminate();if(this.workerUrl){URL.revokeObjectURL(this.workerUrl);this.workerUrl=null}this.onStatus('Ativando modo de compatibilidade…');try{await AwbDecode.load();if(this.stopped)return;this.ready=true;this.schedule()}catch{if(!this.stopped){this.onStatus('Leitor indisponível. Toque em Ler novamente ou use uma foto.');this.stop()}}}

    const sh=(++this.frame%3===0)?vh:Math.round(vh*0.6),sy=Math.round((vh-sh)/2),scale=Math.min(1,1920/vw);
    this.canvas.width=Math.round(vw*scale);this.canvas.height=Math.round(sh*scale);
    try{
      this.ctx.drawImage(this.video,0,sy,vw,sh,0,0,this.canvas.width,this.canvas.height);
      const frame=this.ctx.getImageData(0,0,this.canvas.width,this.canvas.height);this.busy=true;
      if(this.direct){AwbDecode.read(frame,1).then(codes=>this.result(codes)).catch(()=>{if(!this.stopped){this.onStatus('Falha ao analisar a imagem. Tente Ler foto da etiqueta.');this.stop()}})}
      else{this.watchdog=setTimeout(()=>this.useDirect(),4000);this.worker.postMessage({buffer:frame.data.buffer,width:frame.width,height:frame.height},[frame.data.buffer])}
    }catch{this.onStatus('Não foi possível capturar a imagem. Tente Ler foto da etiqueta.');this.stop()}
  }
  stop(){this.stopped=true;clearTimeout(this.timer);clearTimeout(this.timeout);clearTimeout(this.watchdog);this.worker?.terminate();if(this.workerUrl){URL.revokeObjectURL(this.workerUrl);this.workerUrl=null}this.stream?.getTracks().forEach(t=>t.stop());this.video.srcObject=null;this.controls.replaceChildren()}
};

function getPesosDayOfWeek(isoDateStr) {
  const target = (isoDateStr && /^\d{4}-\d{2}-\d{2}$/.test(String(isoDateStr).slice(0, 10)))
    ? String(isoDateStr).slice(0, 10)
    : todayIsoBrazil();
  const [yy, mm, dd] = target.split('-').map(Number);
  const dt = new Date(yy, mm - 1, dd);
  return isNaN(dt.getTime()) ? new Date().getDay() : dt.getDay();
}

function matchMalhaItemForPesosDest(destCode) {
  if (!destCode || !Array.isArray(pesosMalhaCatalog) || !pesosMalhaCatalog.length) return null;
  const codeUp = String(destCode).trim().toUpperCase();

  if (codeUp === 'FORA FORMAL') {
    return pesosMalhaCatalog.find(m => String(m.iata || '').toUpperCase().includes('FORMAL')) || null;
  }

  const exact = pesosMalhaCatalog.find(m => {
    const mi = String(m.iata || '').trim().toUpperCase();
    if (mi === codeUp) return true;
    if (codeUp === 'BSBA SACAS' && (mi === 'BSBA SACA' || mi === 'BSBA SACAS' || mi === 'BSB SACA' || mi === 'BSB SACAS')) return true;
    if (codeUp === 'BSBA CAIXAS' && (mi === 'BSBA CAIXAS' || mi === 'BSBA CAIXA' || mi === 'BSB CAIXAS' || mi === 'BSB CAIXA')) return true;
    if (codeUp === 'JPAA' && (mi === 'JPAA' || mi === 'JPA' || mi.startsWith('JPA'))) return true;
    if (codeUp === 'ITNA' && (mi === 'ITNA' || mi === 'ITN' || mi.includes('ITN'))) return true;
    return false;
  });
  if (exact) return exact;

  const isSacaDest = codeUp.includes('SACA');
  const isFormalDest = codeUp.includes('FORMAL');
  const iata3 = codeUp.split(/[\s/]+/)[0].slice(0, 3);
  if (iata3.length === 3) {
    return pesosMalhaCatalog.find(m => {
      const mc = String(m.iata || '').trim().toUpperCase();
      if (!mc) return false;
      const cToken = mc.split(/[\s/]+/)[0];
      if (cToken.slice(0, 3) !== iata3) return false;
      if (mc.includes('FORMAL') && !isFormalDest) return false;
      if (mc.includes('SACA') && !isSacaDest) return false;
      if (mc.includes('CAIXA') && isSacaDest) return false;
      return true;
    }) || null;
  }
  return null;
}

function resolveDestMalhaInfo(destCode) {
  const codeUp = String(destCode || '').trim().toUpperCase();
  if (codeUp === 'BRAA') {
    const itemBra = matchMalhaItemForPesosDest('BRAA');
    return {
      orig: (itemBra && itemBra.origem) ? String(itemBra.origem).trim().toUpperCase() : 'VCP',
      cia: (itemBra && itemBra.cia) ? String(itemBra.cia).trim().toUpperCase() : 'AZUL'
    };
  }

  const curOp = active ? op() : null;
  const refDateIso = curOp?.data_operacao || todayIsoBrazil();
  const diaSemana = getPesosDayOfWeek(refDateIso);
  const def = DEFAULT_PESOS_MALHA[codeUp] || { orig: 'GRU', cia: 'LATAM' };
  const itemMalha = matchMalhaItemForPesosDest(codeUp);

  let orig = (itemMalha && itemMalha.origem) ? String(itemMalha.origem).trim().toUpperCase() : def.orig;
  let cia = (itemMalha && itemMalha.cia) ? String(itemMalha.cia).trim().toUpperCase() : def.cia;
  let appliedDayRule = false;

  if (itemMalha && itemMalha.regra) {
    const regraTxt = String(itemMalha.regra || '').trim();
    if (regraTxt.startsWith('{')) {
      try {
        const r = JSON.parse(regraTxt);
        if (r.tipo === 'DIA' && Array.isArray(r.dias)) {
          const diasNum = r.dias.map(x => Number(x));
          if (diasNum.includes(diaSemana)) {
            if (r.acao_origem) orig = String(r.acao_origem).trim().toUpperCase();
            if (r.acao_cia) cia = String(r.acao_cia).trim().toUpperCase();
          }
          appliedDayRule = true;
        } else if (r.tipo === 'PESO' && curOp && Array.isArray(curOp.records)) {
          const curKg = sum(curOp.records.filter(x => x.dest === codeUp)).kg;
          if (curKg > Number(r.peso || 0)) {
            if (r.acao_origem) orig = String(r.acao_origem).trim().toUpperCase();
            if (r.acao_cia) cia = String(r.acao_cia).trim().toUpperCase();
          }
        }
      } catch {}
    } else if (regraTxt) {
      const rUp = regraTxt.toUpperCase();
      if (rUp.includes('SEXTAS FEIRAS') && diaSemana === 5 && rUp.includes('ORIGEM CGH')) {
        orig = 'CGH';
        appliedDayRule = true;
      }
    }
  }

  // Regra padrão garantida para Goiânia (GYNA): Seg a Qua = GRU | Qui e Sex = CGH
  if (!appliedDayRule && (codeUp === 'GYNA' || codeUp === 'GYN')) {
    if (diaSemana >= 1 && diaSemana <= 3) orig = 'GRU';
    else if (diaSemana === 4 || diaSemana === 5) orig = 'CGH';
  }

  return { orig: orig || 'GRU', cia: cia || 'LATAM' };
}

async function fetchCorrectionsForOp(o) {

  const candidates = [];
  const checkPayload = (p) => {
    if (!p || typeof p !== 'object') return;
    if (p.operacao_id) {
      if (String(p.operacao_id) === String(o.id)) {
        candidates.push(p);
      }
      return;
    }
    const sameDateOpsCount = state.ops.filter(x => x.status === 'ABERTA' && x.data_operacao && o.data_operacao && String(x.data_operacao).slice(0, 10) === String(o.data_operacao).slice(0, 10)).length;
    const matchesDate = p.flight_date && o.data_operacao && String(p.flight_date).slice(0, 10) === String(o.data_operacao).slice(0, 10) && sameDateOpsCount <= 1;
    if (matchesDate) {
      candidates.push(p);
    }
  };

  try {
    const r1 = localStorage.getItem('peso_correcoes_ia_' + o.id);
    if (r1) checkPayload(JSON.parse(r1));
  } catch {}
  try {
    if (o.data_operacao) {
      const r2 = localStorage.getItem('peso_correcoes_ia_date_' + o.data_operacao);
      if (r2) checkPayload(JSON.parse(r2));
    }
  } catch {}
  try {
    const r3 = localStorage.getItem('peso_correcoes_ia_latest');
    if (r3) checkPayload(JSON.parse(r3));
  } catch {}

  try {
    const ids = [`__SYS_PESOS_CORRECOES__${o.id}`, '__SYS_PESOS_CORRECOES__LATEST'];
    if (o.data_operacao) ids.push(`__SYS_PESOS_CORRECOES_DATE__${o.data_operacao}`);
    const inList = ids.map(x => encodeURIComponent(x)).join(',');
    const res = await fetch(`${SUITE_BRIDGE_URL}/rest/v1/minutas?select=id,dados&id=in.(${inList})`, {
      headers: {
        apikey: SUITE_BRIDGE_KEY,
        Authorization: `Bearer ${SUITE_BRIDGE_KEY}`,
        'Content-Type': 'application/json'
      },
      cache: 'no-store'
    });
    if (res.ok) {
      const rows = await res.json();
      if (Array.isArray(rows)) {
        for (const row of rows) {
          if (row && row.dados) checkPayload(row.dados);
        }
      }
    }
  } catch {}

  if (!candidates.length) return [];
  candidates.sort((a, b) => Number(b.updated_at || 0) - Number(a.updated_at || 0));
  const best = candidates[0];
  try {
    localStorage.setItem('peso_correcoes_ia_' + o.id, JSON.stringify(best));
  } catch {}
  if (best.cleared) return [];
  return Array.isArray(best.corrections) ? best.corrections : [];
}

function applyCorrectionsToOperationRecords(operation) {
  if (!operation) return;
  const rawList = Array.isArray(operation.rawRecords) ? operation.rawRecords : (Array.isArray(operation.records) ? operation.records.filter(r => !r.isCorrectionSynthetic) : []);
  const baseRecords = rawList.map(r => ({
    ...r,
    naoContabiliza: false,
    contabilizaCorrecao: false,
    isCorrectionSynthetic: false,
    statusCorrecao: null,
    correcaoBadge: null,
    correcaoDetalhe: null
  }));
  const corrs = Array.isArray(operation.corrections) ? operation.corrections : [];
  if (!corrs.length) {
    operation.records = baseRecords;
    return;
  }

  for (const corr of corrs) {
    if (!corr) continue;
    const cType = String(corr.type || 'TRANSFER').toUpperCase();

    if (cType === 'TRANSFER') {
      const fromDest = String(corr.fromDest || '').trim().toUpperCase();
      const toDest = String(corr.toDest || '').trim().toUpperCase();
      const cVol = Math.max(1, Number(corr.vol || 1));
      const cKg = Math.max(0, Number(corr.kg || 0));
      const fromMins = parseTimeMins(corr.fromTime);
      const srcIds = new Set(Array.isArray(corr.sourceRecordIds) ? corr.sourceRecordIds.map(String) : []);

      // 1) Marca ou desconta no destino de origem (ex.: VIXA) SEM apagar o lançamento
      const fromCandidates = baseRecords.filter(r =>
        r.dest === fromDest &&
        !r.naoContabiliza &&
        !r.isCorrectionSynthetic &&
        recordKind(r) !== 'SACA'
      );

      let matchedExact = null;
      if (srcIds.size > 0) {
        matchedExact = fromCandidates.find(r => srcIds.has(String(r.id)) && r.vol === cVol);
      }
      if (!matchedExact) {
        const sameVol = fromCandidates.filter(r => r.vol === cVol && Math.abs(r.kg - cKg) <= 0.5);
        if (sameVol.length > 0) {
          sameVol.sort((a, b) => {
            const ma = parseTimeMins(a.time), mb = parseTimeMins(b.time);
            const da = (ma !== null && fromMins !== null) ? Math.abs(ma - fromMins) : 999;
            const db = (mb !== null && fromMins !== null) ? Math.abs(mb - fromMins) : 999;
            return da - db;
          });
          matchedExact = sameVol[0];
        }
      }

      if (matchedExact) {
        matchedExact.naoContabiliza = true;
        matchedExact.statusCorrecao = 'TRANSFERIDO';
        matchedExact.correcaoBadge = 'CORREÇÃO IA · NÃO CONTABILIZA';
        matchedExact.correcaoDetalhe = `Transferido para ${toDest} (${cVol} vol · ${fmt(cKg)} kg)`;
      } else {
        // Caso os volumes transferidos façam parte de um lote maior (ex: 2 vol de um lançamento de 6 vol), reduz o lote ativo e mantém o registro visível não contabilizado
        let remVol = cVol;
        let remKg = cKg;
        const sortedFrom = [...fromCandidates].sort((a, b) => {
          if (srcIds.has(String(a.id)) !== srcIds.has(String(b.id))) return srcIds.has(String(a.id)) ? -1 : 1;
          const ma = parseTimeMins(a.time), mb = parseTimeMins(b.time);
          const da = (ma !== null && fromMins !== null) ? Math.abs(ma - fromMins) : 999;
          const db = (mb !== null && fromMins !== null) ? Math.abs(mb - fromMins) : 999;
          return da - db;
        });

        for (const r of sortedFrom) {
          if (remVol <= 0) break;
          if (r.vol <= remVol) {
            remVol -= r.vol;
            remKg = Math.max(0, Math.round((remKg - r.kg) * 1000) / 1000);
            r.naoContabiliza = true;
            r.statusCorrecao = 'TRANSFERIDO';
            r.correcaoBadge = 'CORREÇÃO IA · NÃO CONTABILIZA';
            r.correcaoDetalhe = `Transferido para ${toDest} (${r.vol} vol · ${fmt(r.kg)} kg)`;
          } else {
            const cutKg = remKg > 0 ? Math.min(r.kg, remKg) : Math.round((r.kg * (remVol / r.vol)) * 1000) / 1000;
            r.vol -= remVol;
            r.kg = Math.max(0, Math.round((r.kg - cutKg) * 1000) / 1000);
            baseRecords.push({
              id: `CORR_OUT_${corr.id}`,
              dest: fromDest,
              vol: remVol,
              kg: cutKg,
              dg: false,
              pallet: false,
              type: 'NORMAL',
              category: r.category || 'CAIXA',
              awb: null,
              user: r.user || 'Correção IA',
              time: corr.fromTime || r.time || '',
              created: r.created || new Date().toISOString(),
              naoContabiliza: true,
              isCorrectionSynthetic: true,
              statusCorrecao: 'TRANSFERIDO',
              correcaoBadge: 'CORREÇÃO IA · NÃO CONTABILIZA',
              correcaoDetalhe: `Transferido para ${toDest} (${remVol} vol · ${fmt(cutKg)} kg)`
            });
            remVol = 0;
            remKg = 0;
          }
        }

        if (remVol > 0) {
          baseRecords.push({
            id: `CORR_OUT_${corr.id}`,
            dest: fromDest,
            vol: remVol,
            kg: remKg,
            dg: false,
            pallet: false,
            type: 'NORMAL',
            category: 'CAIXA',
            awb: null,
            user: 'Correção IA',
            time: corr.fromTime || '',
            created: new Date().toISOString(),
            naoContabiliza: true,
            isCorrectionSynthetic: true,
            statusCorrecao: 'TRANSFERIDO',
            correcaoBadge: 'CORREÇÃO IA · NÃO CONTABILIZA',
            correcaoDetalhe: `Transferido para ${toDest} (${remVol} vol · ${fmt(remKg)} kg)`
          });
        }
      }

      // 2) Insere no destino correto (ex.: BSBA CAIXAS) contabilizando nos volumes e peso e indicando de onde veio
      if (toDest) {
        baseRecords.push({
          id: `CORR_IN_${corr.id}`,
          dest: toDest,
          vol: cVol,
          kg: cKg,
          dg: false,
          pallet: false,
          type: 'NORMAL',
          category: corr.cat || (toDest.includes('SACA') ? 'SACA' : 'CAIXA'),
          awb: null,
          user: 'Correção IA',
          time: corr.toTime || corr.fromTime || corr.approvedAt || '',
          created: new Date().toISOString(),
          naoContabiliza: false,
          contabilizaCorrecao: true,
          isCorrectionSynthetic: true,
          statusCorrecao: 'RECEBIDO',
          correcaoBadge: 'CORREÇÃO IA · CONTABILIZADO',
          correcaoDetalhe: `Vieram de ${fromDest} via Correção IA (${cVol} vol · ${fmt(cKg)} kg)`
        });
      }
    } else if (cType === 'DUPLICATE') {
      const dest = String(corr.dest || '').trim().toUpperCase();
      const cVol = Math.max(1, Number(corr.vol || 1));
      const cKg = Math.max(0, Number(corr.kg || 0));
      const dupMins = parseTimeMins(corr.time);
      const candidates = baseRecords.filter(r => r.dest === dest && !r.naoContabiliza && !r.isCorrectionSynthetic);
      const exactMatches = candidates.filter(r => r.vol === cVol && Math.abs(r.kg - cKg) <= 0.25);
      if (exactMatches.length > 0) {
        exactMatches.sort((a, b) => {
          const ma = parseTimeMins(a.time), mb = parseTimeMins(b.time);
          const da = (ma !== null && dupMins !== null) ? Math.abs(ma - dupMins) : 999;
          const db = (mb !== null && dupMins !== null) ? Math.abs(mb - dupMins) : 999;
          return da - db;
        });
        const target = exactMatches[exactMatches.length - 1] || exactMatches[0];
        target.naoContabiliza = true;
        target.statusCorrecao = 'DUPLICADO';
        target.correcaoBadge = 'DUPLICADO · NÃO CONTABILIZA';
        target.correcaoDetalhe = `Peso duplicado descontado pela IA (${cVol} vol · ${fmt(cKg)} kg)`;
      } else if (candidates.length > 0) {
        const target = candidates[candidates.length - 1];
        if (target.vol > cVol) {
          target.vol -= cVol;
          target.kg = Math.max(0, Math.round((target.kg - cKg) * 1000) / 1000);
          baseRecords.push({
            id: `CORR_DUP_${corr.id}`,
            dest,
            vol: cVol,
            kg: cKg,
            dg: false,
            pallet: false,
            type: 'NORMAL',
            category: target.category || 'CAIXA',
            awb: null,
            user: target.user || 'Correção IA',
            time: corr.time || target.time || '',
            created: target.created || new Date().toISOString(),
            naoContabiliza: true,
            isCorrectionSynthetic: true,
            statusCorrecao: 'DUPLICADO',
            correcaoBadge: 'DUPLICADO · NÃO CONTABILIZA',
            correcaoDetalhe: `Peso duplicado descontado pela IA (${cVol} vol · ${fmt(cKg)} kg)`
          });
        } else {
          target.naoContabiliza = true;
          target.statusCorrecao = 'DUPLICADO';
          target.correcaoBadge = 'DUPLICADO · NÃO CONTABILIZA';
          target.correcaoDetalhe = `Peso duplicado descontado pela IA (${target.vol} vol · ${fmt(target.kg)} kg)`;
        }
      }
    } else if (cType === 'TYPO') {
      const dest = String(corr.dest || '').trim().toUpperCase();
      const deltaKg = Math.max(0, Number(corr.kg || 0));
      const appKg = Number(corr.appKg || 0);
      const suggestedKg = Number(corr.suggestedKg || 0);
      const candidates = baseRecords.filter(r => r.dest === dest && !r.naoContabiliza && !r.isCorrectionSynthetic);
      let target = candidates.find(r => appKg > 0 && Math.abs(r.kg - appKg) <= 0.5) || candidates.find(r => r.kg > deltaKg);
      if (target) {
        const oldKg = target.kg;
        const newKg = suggestedKg > 0 ? suggestedKg : Math.max(0.5, Math.round((oldKg - deltaKg) * 1000) / 1000);
        target.kg = newKg;
        target.statusCorrecao = 'AJUSTADO_PESO';
        target.correcaoBadge = 'CORREÇÃO IA · PESO AJUSTADO';
        target.correcaoDetalhe = `Peso corrigido pela IA: de ${fmt(oldKg)} kg para ${fmt(newKg)} kg (-${fmt(deltaKg)} kg erro de digitação não contabiliza)`;
      }
    }
  }

  operation.records = baseRecords;
}

async function clearCorrectionsForActiveOp() {
  const o = op();
  if (!o) return;
  const activeCount = Array.isArray(o.corrections) ? o.corrections.length : 0;
  if (activeCount === 0) {
    toast('Nenhuma correção da IA ativa nesta operação no momento.');
    return;
  }
  if (!await ask(
    'Limpar correção da IA?',
    `Deseja limpar ${activeCount === 1 ? 'a correção recebida' : 'as ' + activeCount + ' correções recebidas'} do Controle Operacional e voltar a operação exatamente como estava antes?`,
    'Sim, limpar correção'
  )) return;

  o.corrections = [];
  applyCorrectionsToOperationRecords(o);
  safeRender();

  const clearPayload = {
    operacao_id: o.id,
    flight_date: o.data_operacao || '',
    op_name: o.nome || '',
    cleared: true,
    updated_at: Date.now(),
    corrections: []
  };

  try {
    localStorage.setItem('peso_correcoes_ia_' + o.id, JSON.stringify(clearPayload));
    if (o.data_operacao) localStorage.setItem('peso_correcoes_ia_date_' + o.data_operacao, JSON.stringify(clearPayload));
    localStorage.setItem('peso_correcoes_ia_latest', JSON.stringify(clearPayload));
  } catch {}

  try {
    const bc = new BroadcastChannel('fedex_aereo_pesos_channel');
    bc.postMessage({ type: 'CORRECOES_LIMPAS_NO_PESOS', operacao_id: o.id, flight_date: o.data_operacao });
    bc.close();
  } catch {}

  try {
    const bcMin = new BroadcastChannel('fedex_aereo_minutas_channel');
    bcMin.postMessage({ type: 'CORRECOES_LIMPAS_NO_PESOS', operacao_id: o.id, flight_date: o.data_operacao });
    bcMin.close();
  } catch {}

  try {
    if (window.suiteBridgeRealtimeChannel) {
      window.suiteBridgeRealtimeChannel.send({
        type: 'broadcast',
        event: 'CORRECOES_LIMPAS_NO_PESOS',
        payload: { type: 'CORRECOES_LIMPAS_NO_PESOS', operacao_id: o.id, flight_date: o.data_operacao }
      });
    }
  } catch {}

  try {
    const rowsToClear = [
      { id: '__SYS_PESOS_CORRECOES__LATEST', destino: 'SYS_PESOS_CORR', cia: 'SYS', operador: state.name || 'PESOS', status: 'ATIVA', operacao: o.id, dados: clearPayload },
      { id: '__SYS_PESOS_CORRECOES__' + o.id, destino: 'SYS_PESOS_CORR', cia: 'SYS', operador: state.name || 'PESOS', status: 'ATIVA', operacao: o.id, dados: clearPayload }
    ];
    if (o.data_operacao) {
      rowsToClear.push({ id: '__SYS_PESOS_CORRECOES_DATE__' + o.data_operacao, destino: 'SYS_PESOS_CORR', cia: 'SYS', operador: state.name || 'PESOS', status: 'ATIVA', operacao: o.data_operacao, dados: clearPayload });
    }
    await fetch(`${SUITE_BRIDGE_URL}/rest/v1/minutas?on_conflict=id`, {
      method: 'POST',
      headers: {
        apikey: SUITE_BRIDGE_KEY,
        Authorization: `Bearer ${SUITE_BRIDGE_KEY}`,
        'Content-Type': 'application/json',
        Prefer: 'resolution=merge-duplicates,return=minimal'
      },
      body: JSON.stringify(rowsToClear)
    });
  } catch {}

  toast('Correções limpas! A operação voltou ao estado original.');
}

function handleIncomingBridgePayload(data){
  if(!data)return;
  if(data.type==='MALHA_ATUALIZADA'&&Array.isArray(data.malha)){
    savePesosMalhaLocalCache(data.malha);
    if(stage===1&&$('#destlist'))list();
    return;
  }
  const p=data.payload||data;
  if(data.type==='PESOS_CORRECOES_IA'||Array.isArray(p?.corrections)){
    const targetOp = p?.operacao_id
      ? state.ops.find(x => String(x.id) === String(p.operacao_id))
      : op();
    if(targetOp){
      const matchesId = p.operacao_id && String(p.operacao_id) === String(targetOp.id);
      const sameDateOpsCount = state.ops.filter(x => x.status === 'ABERTA' && x.data_operacao && targetOp.data_operacao && String(x.data_operacao).slice(0, 10) === String(targetOp.data_operacao).slice(0, 10)).length;
      const matchesDate = !p.operacao_id && p.flight_date && targetOp.data_operacao && String(p.flight_date).slice(0,10) === String(targetOp.data_operacao).slice(0,10) && sameDateOpsCount <= 1;
      if(matchesId || matchesDate){
        targetOp.corrections = p.cleared ? [] : (Array.isArray(p.corrections) ? p.corrections : []);
        try{localStorage.setItem('peso_correcoes_ia_'+targetOp.id, JSON.stringify(p))}catch{}
        applyCorrectionsToOperationRecords(targetOp);
        safeRender();
        if(active === targetOp.id && targetOp.corrections.length > 0){
          toast(`🔧 Correção da IA recebida do Controle Operacional (${targetOp.corrections.length} ajuste${targetOp.corrections.length>1?'s':''}).`);
        }
      }
    }
  }
}
function setupRealtime(){
  try{
    const bc1=new BroadcastChannel('fedex_aereo_pesos_channel');
    bc1.onmessage=ev=>handleIncomingBridgePayload(ev.data);
  }catch{}
  try{
    const bc2=new BroadcastChannel('fedex_aereo_minutas_channel');
    bc2.onmessage=ev=>handleIncomingBridgePayload(ev.data);
  }catch{}
  if(!window.supabase)return;
  realtime=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false}});
  realtime.channel('operacoes-equipe').on('postgres_changes',{event:'*',schema:'public',table:'operacoes'},scheduleRefresh).subscribe(s=>{opsLive=s==='SUBSCRIBED'});
  realtime.channel('usuarios-equipe').on('postgres_changes',{event:'*',schema:'public',table:'usuarios'},async()=>{try{users=await api('usuarios?select=*&ativo=eq.true&order=nome');safeRender()}catch{}}).subscribe();
  try{
    const bridgeClient=window.supabase.createClient(SUITE_BRIDGE_URL,SUITE_BRIDGE_KEY,{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false}});
    window.suiteBridgeRealtimeChannel=bridgeClient.channel('fedex-aereo-minutas-sync',{config:{broadcast:{self:false}}})
      .on('broadcast',{event:'MALHA_ATUALIZADA'},payload=>handleIncomingBridgePayload(payload.payload))
      .on('broadcast',{event:'PESOS_CORRECOES_IA'},payload=>handleIncomingBridgePayload(payload.payload))
      .on('postgres_changes',{event:'*',schema:'public',table:'malha'},()=>syncMalhaDirectFromDb())
      .subscribe();
  }catch{}
}

function create(){
  if(state.ops.some(o=>o.status==='ABERTA')){
    toast('Finalize a operação aberta antes de criar outra.');
    return;
  }
  const localDate=new Intl.DateTimeFormat('pt-BR',{timeZone:'America/Sao_Paulo'}).format(new Date());
  const layer=modal(`<h2>Nova operação</h2><form id="newop"><label class="field" for="opname" style="margin-top:16px">Nome da operação</label><input id="opname" class="input" required maxlength="100" value="Operação ${localDate}"><button class="primary wide" id="createSave">Criar e entrar →</button><button type="button" class="plain wide" id="cancel">Cancelar</button></form>`);
  const id=crypto.randomUUID();
  const close=()=>{document.removeEventListener('keydown',onKey);layer.remove()};
  const onKey=e=>{if(e.key==='Escape')close()};
  document.addEventListener('keydown',onKey);

  layer.querySelector('#newop').onsubmit=async e=>{
    e.preventDefault();

    if(!nome)return;

      if(state.ops.some(o=>o.status==='ABERTA')){

      }
      try{
        await api('operacoes?on_conflict=id',{method:'POST',body:{id,nome,data_operacao:dataOp,criada_por:selectedUser},prefer:'resolution=ignore-duplicates,return=representation'});

      close();

      toast(errorMessage(error));

async function reopenFromHistory(id){
  if(state.ops.some(o=>o.status==='ABERTA'&&o.id!==id)){
    toast('Finalize a operação em andamento antes de reabrir outra.');

  if(!await ask('Reabrir operação?','A equipe poderá corrigir ou incluir pesagens.','Reabrir'))return;
  try{
    await api(`operacoes?id=eq.${encodeURIComponent(id)}`,{method:'PATCH',body:{status:'ABERTA'}});
    historyView=false;
    await refresh();
    toast('Operação reaberta.');
    enterOperation(id);
  }catch(e){
    toast(errorMessage(e));
    await refresh();
  }
}

async function persistPesagemRecord(o,body,isPlt){

    if(edit){
      const result=await api(`pesagens?id=eq.${edit}&atualizada_em=eq.${encodeURIComponent(editVersion)}`,{method:'PATCH',body:{...payload,editado_por:selectedUser}});

    }else{
      return await api('pesagens?on_conflict=id',{method:'POST',body:{...payload,id:draftId,operacao_id:o.id,usuario_id:selectedUser},prefer:'resolution=ignore-duplicates,return=representation'});

  const existingRec=edit?o.records?.find(r=>r.id===edit):null;
  const createdIso=existingRec?.created||new Date().toISOString();
  const createdTime=existingRec?.time||showTime(createdIso);
  const metaPayload={id:recId,operacao_id:o.id,dest:chosen,vol,kg:body.peso_kg,awb,user:state.name||'Usuário',criada_em:createdIso,horario:createdTime,updatedAt:new Date().toISOString()};

    savedRes=await trySave({destino:chosen,volumes:vol,peso_kg:body.peso_kg,tipo:'PALLET',awb,...(hasCategories?{categoria:'PALLET'}:{})});
  }catch(e1){
    try{
      savedRes=await trySave({destino:chosen,volumes:vol,peso_kg:body.peso_kg,tipo:'NORMAL',awb:'PALLET:'+awb,...(hasCategories?{categoria:'CAIXA'}:{})});
    }catch(e2){
      savedRes=await trySave({destino:chosen,volumes:vol,peso_kg:body.peso_kg,tipo:'NORMAL',awb:null,...(hasCategories?{categoria:'CAIXA'}:{})});
    }
  }

    await savePalletMetaForOp(o.id,savedRes[0].id||recId,{...metaPayload,id:savedRes[0].id||recId,criada_em:savedRes[0].criada_em,horario:showTime(savedRes[0].criada_em)});
  }

}

function excelBrazilDate(value){const parts=new Intl.DateTimeFormat('en-US',{timeZone:'America/Sao_Paulo',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hourCycle:'h23'}).formatToParts(new Date(value));const p=Object.fromEntries(parts.map(x=>[x.type,x.value]));return new Date(Date.UTC(+p.year,+p.month-1,+p.day,+p.hour,+p.minute,+p.second))}
function buildExportWorkbook(o,Excel){const book=new Excel.Workbook();book.creator='Sistema Aéreo - Gestão de Pesos';book.created=new Date();const meta=book.addWorksheet('OPERACAO');meta.columns=[{header:'CAMPO',key:'campo',width:24},{header:'VALOR',key:'valor',width:60}];meta.addRows([{campo:'VERSAO_LAYOUT',valor:3},{campo:'OPERACAO_ID',valor:o.id},{campo:'NOME',valor:o.nome},{campo:'DATA_OPERACAO',valor:new Date(o.data_operacao+'T12:00:00Z')},{campo:'STATUS',valor:o.status},{campo:'GERADO_EM',valor:excelBrazilDate(new Date())},{campo:'VOLUMES_TOTAL',valor:sum(o.records).vol},{campo:'PESO_TOTAL_KG',valor:sum(o.records).kg}]);meta.getCell('B5').numFmt='dd/mm/yyyy';meta.getCell('B7').numFmt='dd/mm/yyyy hh:mm:ss';meta.getCell('B9').numFmt='0.000';const summary=book.addWorksheet('RESUMO');summary.columns=[{header:'DESTINO',key:'dest',width:23},{header:'TIPO',key:'tipo',width:13},{header:'VOLUMES',key:'vol',width:14},{header:'PESO_KG',key:'kg',width:16}];for(const [dest] of grouped(o.records)){for(const tipo of CATEGORY_ORDER){const records=o.records.filter(r=>r.dest===dest&&recordKind(r)===tipo);if(records.length)summary.addRow({dest,tipo,...sum(records)})}}summary.getColumn('kg').numFmt='0.000';const dg=book.addWorksheet('DG');dg.columns=[{header:'AWB',key:'awb',width:20},{header:'DESTINO',key:'dest',width:23},{header:'VOLUMES',key:'vol',width:13},{header:'PESO_KG',key:'kg',width:15},{header:'USUARIO',key:'user',width:20},{header:'REGISTRADO_EM',key:'created',width:24}];for(const r of o.records.filter(r=>r.dg))dg.addRow({awb:String(r.awb),dest:formatRecordDestLabel(r),vol:1,kg:r.kg,user:r.user,created:excelBrazilDate(r.created)});dg.getColumn('awb').numFmt='@';dg.getColumn('kg').numFmt='0.000';dg.getColumn('created').numFmt='dd/mm/yyyy hh:mm:ss';const plt=book.addWorksheet('PALLET');plt.columns=[{header:'AWB',key:'awb',width:20},{header:'DESTINO',key:'dest',width:23},{header:'VOLUMES',key:'vol',width:13},{header:'PESO_KG',key:'kg',width:15},{header:'USUARIO',key:'user',width:20},{header:'REGISTRADO_EM',key:'created',width:24}];for(const r of o.records.filter(r=>r.pallet||recordKind(r)==='PALLET'))plt.addRow({awb:String(r.awb||''),dest:r.dest,vol:r.vol,kg:r.kg,user:r.user,created:excelBrazilDate(r.created)});plt.getColumn('awb').numFmt='@';plt.getColumn('kg').numFmt='0.000';plt.getColumn('created').numFmt='dd/mm/yyyy hh:mm:ss';const detail=book.addWorksheet('DETALHAMENTO');detail.columns=[{header:'DESTINO',key:'dest',width:23},{header:'TIPO',key:'category',width:20},{header:'VOLUMES',key:'vol',width:14},{header:'PESO_KG',key:'kg',width:16},{header:'HORARIO',key:'time',width:14},{header:'AWB',key:'awb',width:20},{header:'USUARIO',key:'user',width:18},{header:'REGISTRADO_EM',key:'created',width:22}];for(const r of o.records){detail.addRow({dest:r.dest,category:recordKind(r),vol:r.vol,kg:r.kg,time:r.time||showTime(r.created),awb:String(r.awb||''),user:r.user||'',created:r.created?excelBrazilDate(r.created):''})}detail.getColumn('kg').numFmt='0.000';detail.getColumn('awb').numFmt='@';detail.getColumn('created').numFmt='dd/mm/yyyy hh:mm:ss';for(const sheet of book.worksheets){sheet.views=[{state:'frozen',ySplit:1}];sheet.getRow(1).height=27;sheet.getRow(1).eachCell(cell=>{cell.font={bold:true,color:{argb:'FFFFFFFF'}};cell.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FF059669'}};cell.alignment={vertical:'middle'}});sheet.autoFilter={from:{row:1,column:1},to:{row:Math.max(1,sheet.rowCount),column:sheet.columnCount}}}return book}
let excelPromise;
function loadExcel(){if(window.ExcelJS)return Promise.resolve(window.ExcelJS);if(!excelPromise)excelPromise=new Promise((resolve,reject)=>{const script=document.createElement('script');script.src='https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js';script.onload=()=>resolve(window.ExcelJS);script.onerror=()=>{const fallback=document.createElement('script');fallback.src='/exceljs.min.js';fallback.onload=()=>resolve(window.ExcelJS);fallback.onerror=()=>{excelPromise=null;reject(Error('Não foi possível carregar o exportador Excel. Tente novamente.'))};document.head.append(fallback)};document.head.append(script)});return excelPromise}
async function exportExcel(){const button=$('#export'),id=active;button.disabled=true;button.textContent='Gerando Excel…';try{const Excel=await loadExcel();await loadOperations();if(!state.ops.some(o=>o.id===id))throw Error('Operação não encontrada.');await loadRecords(id);const o=state.ops.find(o=>o.id===id);const book=buildExportWorkbook(o,Excel),buffer=await book.xlsx.writeBuffer(),blob=new Blob([buffer],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}),url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download=`PESOS_${o.data_operacao}_${o.id.slice(0,8)}.xlsx`;document.body.append(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);toast(o.status==='FINALIZADA'?'Excel gerado com os dados da operação.':'Excel parcial gerado. A operação ainda está aberta.')}catch(e){toast(errorMessage(e))}finally{safeRender()}}
