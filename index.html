.intro:has(.priority-actions){display:block}.operation-actions.priority-actions{display:block;width:100%;margin-top:20px}.main-types{display:grid;grid-template-columns:1fr;gap:12px}.intro .main-types .primary{margin-top:0;min-height:68px;width:100%;font-size:18px;font-weight:750}.other-types-label{margin:22px 0 10px;font-size:11px;font-weight:700;letter-spacing:1.4px;color:var(--muted)}.special-types{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.special-types button{min-height:48px;padding:12px 5px;font-size:12px}.special-kind{font-weight:800;font-size:18px;border:2px solid currentColor;padding:14px;border-radius:12px}.stephead .eyebrow{font-weight:750;text-align:center}

.scanner .stepin{overflow-y:auto}.scanner .photo-scan{margin:7px 0;flex-shrink:0}.scanner .camera-box{flex-shrink:0}.scanner .scan-actions{flex-shrink:0}.scanner .camera-status{min-height:36px}

/* === 8 Improvements: Destination History, Edit in Modals, Search/Filter, Swipe Tabs, Category Colors, Dark Mode === */
.dest-row{width:100%;text-align:left;background:transparent;color:inherit;cursor:pointer;border-radius:12px;padding:16px 10px;margin:0 -10px;width:calc(100% + 20px);transition:background .15s}
.dest-row:hover{background:#f4effb}
.dest-row:focus-visible{outline:3px solid var(--purple);outline-offset:2px}
.dest-row-hint{display:inline-block;margin-top:4px;font-size:11px;font-weight:600;color:var(--purple)}
.dest-detail-summary{margin-top:6px;font-size:12px;color:var(--muted);font-weight:500;display:flex;flex-wrap:wrap;gap:6px}

/* Category Color Badges */
.cat-badge{display:inline-flex;align-items:center;padding:2px 7px;border-radius:6px;font-size:11px;font-weight:700;letter-spacing:.3px}
.cat-CAIXA{background:#dbeafe;color:#1d4ed8}
.cat-SACA{background:#dcfce7;color:#15803d}
.cat-DG{background:#fee2e2;color:#b91c1c}
.cat-PALLET{background:#ede9fe;color:#6d28d9}
.cat-DELIVERY{background:#fef3c7;color:#b45309}
.cat-COMAIL{background:#ccfbf1;color:#0f766e}
.cat-SEM_CLASSIFICACAO{background:#f0eef4;color:#6b6675}

.special-stat[data-special-kind="DG"]{border-left:4px solid #dc2626}
.special-stat[data-special-kind="DG"]>span{color:#b91c1c}
.special-stat[data-special-kind="PALLET"]{border-left:4px solid #7c3aed}
.special-stat[data-special-kind="PALLET"]>span{color:#6d28d9}
.special-stat[data-special-kind="DELIVERY"]{border-left:4px solid #d97706}
.special-stat[data-special-kind="DELIVERY"]>span{color:#b45309}
.special-stat[data-special-kind="COMAIL"]{border-left:4px solid #0d9488}
.special-stat[data-special-kind="COMAIL"]>span{color:#0f766e}

#insertdg{background:#fee2e2;color:#b91c1c}
#insertPallet{background:#ede9fe;color:#6d28d9}
#insertDelivery{background:#fef3c7;color:#b45309}
#insertComail{background:#ccfbf1;color:#0f766e}
.special-types{grid-template-columns:repeat(auto-fit,minmax(76px,1fr))!important}
.stats.special-stats{grid-template-columns:repeat(auto-fit,minmax(120px,1fr))!important}

/* Modal row actions */
.modal-row-actions{display:flex;align-items:center;gap:4px;flex-shrink:0}

/* Search & filter bar in Últimos lançamentos */
.filter-bar{margin-bottom:14px;display:flex;flex-direction:column;gap:8px}
.filter-search{padding:11px 14px;font-size:14px;border-radius:10px}
.filter-chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.filter-chips::-webkit-scrollbar{display:none}
.filter-chip{padding:6px 10px;border-radius:8px;font-size:11px;font-weight:700;background:#f2eff7;color:var(--muted);white-space:nowrap;border:1px solid transparent}
.filter-chip.active{background:var(--purple);color:white}

/* Swipeable Board Tabs (Totais por destino <-> Últimos lançamentos) */
.board-switcher{display:none;margin:18px 0 8px}
.board-tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:#e8e4f0;padding:4px;border-radius:13px}
.board-tab{padding:11px 10px;border-radius:10px;font-size:13px;font-weight:700;background:transparent;color:var(--muted);text-align:center}
.board-tab.active{background:white;color:var(--purple);box-shadow:0 2px 8px #0001}
.swipe-hint{text-align:center;font-size:11px;color:var(--muted);margin-top:6px}
@media(max-width:760px){
  .board-switcher{display:block}
  .grid.swipe-grid{display:block;margin-top:8px}
  .grid.swipe-grid>.board-panel.hidden-mobile{display:none}
}

/* Theme toggle button */
.theme-toggle{width:36px;height:36px;border-radius:10px;background:var(--light);color:var(--purple);display:grid;place-items:center;font-size:16px;padding:0}

/* Suite Top Header Bar (Padronizado Microsoft Suite - Módulo Gestão de Pesos Esmeralda) */
.suite-topbar{background:#ffffff;border-bottom:1px solid #e2e8f0;position:sticky;top:0;z-index:50;transition:background .2s,border-color .2s}
.suite-topbar-inner{max-width:1280px;margin:0 auto;padding:0 16px;height:64px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.suite-brand-wrap{display:flex;align-items:center;gap:18px;min-width:0}
.suite-brand{display:flex;align-items:center;gap:12px;cursor:pointer;text-decoration:none;color:inherit}
.suite-logo-box{width:32px;height:32px;border-radius:8px;background:#059669;display:flex;align-items:center;justify-content:center;color:white;box-shadow:0 1px 2px rgba(0,0,0,.08);flex-shrink:0}
.suite-brand-title{font-size:14px;font-weight:700;color:#0f172a;line-height:1.2;margin:0}
.suite-brand-sub{font-size:10px;font-weight:700;color:#059669;margin:1px 0 0;letter-spacing:.1px}
.suite-op-pill{display:inline-flex;align-items:center;padding:4px 10px;border-radius:6px;background:#ecfdf5;color:#047857;border:1px solid #a7f3d0;font-size:12px;font-weight:700;white-space:nowrap}
.suite-actions{display:flex;align-items:center;gap:10px}
.suite-icon-btn{width:34px;height:34px;border-radius:12px;background:#f1f5f9;color:#475569;display:inline-flex;align-items:center;justify-content:center;font-size:15px;padding:0;transition:background .15s}
.suite-icon-btn:hover{background:#e2e8f0}
.suite-user-box{display:flex;align-items:center;gap:8px}
.suite-user-name{font-size:12px;font-weight:700;color:#334155;text-transform:uppercase}
.suite-finish-btn{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:12px;background:#e11d48;color:white;font-size:12px;font-weight:700}
.suite-finish-btn:hover{background:#f43f5e}

async function detectComail(){try{hasComail=await api('rpc/peso_comail_habilitado',{method:'POST',body:{}})===true}catch(e){if(e.code==='PGRST202'||e.code==='42883')hasComail=false;else throw e}}

function render(){if(stage){wizard();return}if(scanning)return;if(loading){shell('<div class="empty">Conectando à operação da equipe…</div>');return}if(!connected&&!users.length){shell('<section class="login card"><h1>Vamos conectar?</h1><p>Não foi possível acessar o banco neste painel restrito. Confira sua conexão ou abra a demonstração para testar o histórico por destino.</p><button id="retry" class="primary wide">Tentar novamente</button><button id="demoBtn" class="secondary wide" style="margin-top:10px">Testar prévia com dados de exemplo →</button></section>');$('#retry').onclick=()=>{loading=true;boot()};$('#demoBtn').onclick=loadDemoMode;return}
if(screen==='login'){shell(`<section class="login"><span class="eyebrow">PESAGEM DA OPERAÇÃO</span><h1>Quem está pesando?</h1><p>Selecione seu nome para identificar os lançamentos.</p><div class="card user-list">${users.map(u=>`<button class="user-option" data-user="${esc(u.id)}"><span class="avatar">${esc(u.nome.slice(0,2))}</span><b>${esc(u.nome)}</b><span class="arrow">→</span></button>`).join('')}<button class="secondary wide" id="addUser">＋ Adicionar usuário</button></div><button class="plain wide" id="installHelp">Como instalar no celular?</button></section>`);document.querySelectorAll('[data-user]').forEach(b=>b.onclick=()=>{selectedUser=b.dataset.user;state.name=users.find(u=>u.id===selectedUser).nome;try{localStorage.setItem('peso-equipe-user',selectedUser)}catch{}screen='ops';render()});$('#addUser').onclick=addUser;$('#installHelp').onclick=installHelp;return}

const o=op();if(!o){screen='ops';render();return}const t=sum(o.records),closed=o.status==='FINALIZADA';shell(`<button class="back" id="back">← Todas as operações</button><div class="intro"><div><span class="eyebrow">${esc(o.date)} · ${closed?'OPERAÇÃO FINALIZADA':'OPERAÇÃO EM ANDAMENTO'}</span><h1>${esc(o.nome)}</h1><p>${closed?'Relatório disponível. Reabra para corrigir lançamentos.':'Pesagens reunidas por destino.'}</p></div>${closed?'':`<div class="operation-actions priority-actions">${hasCategories?`<div class="main-types"><button class="primary" id="insertBox" ${!o.loaded?'disabled':''}><svg class="type-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m12 3 9 5-9 5-9-5 9-5Z"/><path d="M3 8v10l9 5 9-5V8M12 13v10M7.5 5.5l9 5v4"/></svg><span>INSERIR CAIXA</span></button><button class="primary" id="insertBag" ${!o.loaded?'disabled':''}><svg class="type-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M8 3h8l-2 4h-4L8 3Z"/><path d="M9 7h6M10 7C9 10 4 13 4 18c0 3 3 4 8 4s8-1 8-4c0-5-5-8-6-11"/><path d="m14 8 3 2M9 16c0-2 1-3 2-4"/></svg><span>INSERIR SACA</span></button></div><div class="other-types-label">OUTROS TIPOS</div><div class="special-types"><button class="secondary" id="insertdg" ${!o.loaded?'disabled':''}>DG</button><button class="secondary" id="insertPallet" ${!o.loaded?'disabled':''}>PALLET</button>${hasDelivery?`<button class="secondary" id="insertDelivery" ${!o.loaded?'disabled':''}>DELIVERY</button>`:''}${hasComail?`<button class="secondary" id="insertComail" ${!o.loaded?'disabled':''}>COMAIL</button>`:''}</div>`:`<button class="primary" id="insert" ${!o.loaded?'disabled':''}>＋ Inserir peso</button><button class="secondary" id="insertdg" ${!o.loaded?'disabled':''}>▣ INSERIR DG</button><button class="secondary" id="insertPallet" ${!o.loaded?'disabled':''}>▣ INSERIR PALLET</button>`}</div>`}</div>${!connected?'<div class="connection-warning">Sem conexão: os valores exibidos podem estar desatualizados.</div>':''}<div class="stats"><div class="card stat"><span>Volumes pesados</span><strong>${t.vol}</strong></div><div class="card stat"><span>Peso total · kg</span><strong>${fmt(t.kg)}</strong></div><div class="card stat"><span>Lançamentos</span><strong>${o.records.length}</strong></div></div>${specialStatsHtml(o)}<div class="toolbar"><button class="secondary" id="export" ${!o.loaded?'disabled':''}>↓ Exportar Excel</button><button class="plain" id="reload">↻ Atualizar</button><button class="${closed?'secondary':'plain'}" id="statusAction">${closed?'Reabrir operação':'Finalizar operação'}</button></div><div class="board-switcher"><div class="board-tabs" role="tablist"><button type="button" class="board-tab ${boardTab==='dest'?'active':''}" id="tabBoardDest">Totais por destino (${grouped(o.records).length})</button><button type="button" class="board-tab ${boardTab==='recent'?'active':''}" id="tabBoardRecent">Últimos lançamentos (${o.records.length})</button></div><div class="swipe-hint">← Deslize para o lado para alternar entre as listas →</div></div><div class="grid swipe-grid" id="boardGrid"><section class="card board-panel ${boardTab==='dest'?'':'hidden-mobile'}"><div class="sectionhead"><h2>Totais por destino</h2><span class="chip" id="destCountBadge">${grouped(o.records).length} praças · kg</span></div><div class="filter-bar"><input type="search" id="destSummarySearch" class="input filter-search" placeholder="Buscar código ou cidade (ex.: BELA, Manaus)…" autocomplete="off" value="${esc(destSummaryQuery)}"></div><div id="destSummaryListContainer">${renderDestSummaryRows(o)}</div><div class="total"><span>Total geral</span><span>${fmt(t.kg)} kg</span></div><button class="secondary wide" id="report" style="margin-top:16px" ${!o.loaded?'disabled':''}>Ver resumo da operação ↗</button></section><section class="card board-panel ${boardTab==='recent'?'':'hidden-mobile'}"><div class="sectionhead"><h2>Últimos lançamentos</h2><span class="small muted" id="recentCountLabel">Mais recentes</span></div><div class="filter-bar"><input type="search" id="recordSearch" class="input filter-search" placeholder="Buscar destino, AWB ou colega…" autocomplete="off" value="${esc(recentQuery)}"><div class="filter-chips">${[['ALL','Todos'],['CAIXA','CAIXA'],['SACA','SACA'],['PALLET','PALLET'],['DG','DG'],['DELIVERY','DELIVERY'],['COMAIL','COMAIL']].map(([k,label])=>`<button type="button" class="filter-chip ${recentFilter===k?'active':''}" data-filter-kind="${k}">${label}</button>`).join('')}</div></div><div id="recentListContainer">${renderRecentRows(o,closed)}</div></section></div>`);

async function enterOperation(id){active=id;screen='operation';render();watchRecords(id);try{await loadRecords(id);safeRender()}catch(e){toast(errorMessage(e));connected=false;safeRender()}}
function modal(html){const layer=document.createElement('div');layer.className='modal';layer.innerHTML=`<div class="card">${html}</div>`;document.body.append(layer);return layer}
function filterDestGroups(records){const q=destSummaryQuery.trim().toLocaleLowerCase();const all=grouped(records);if(!q)return all;return all.filter(([d])=>`${d} ${cityNames[d]||''}`.toLocaleLowerCase().includes(q))}

function bindSwipeBoard(){const grid=$('#boardGrid');if(!grid)return;let sx=0,sy=0;grid.addEventListener('touchstart',e=>{if(e.touches.length!==1)return;sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});grid.addEventListener('touchend',e=>{if(!e.changedTouches.length)return;const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.abs(dx)>55&&Math.abs(dx)>Math.abs(dy)*1.5){if(dx<0&&boardTab!=='recent'){boardTab='recent';render()}else if(dx>0&&boardTab!=='dest'){boardTab='dest';render()}}},{passive:true})}

async function persistPesagemRecord(o,body,isPlt){
  const trySave=async(payload)=>{
    if(edit){
      const result=await api(`pesagens?id=eq.${edit}&atualizada_em=eq.${encodeURIComponent(editVersion)}`,{method:'PATCH',body:{...payload,editado_por:selectedUser}});
      if(!result.length)throw Error('O lançamento foi alterado por outro colega. Volte ao histórico, confira e edite novamente.');
      return result;
    }else{
      return await api('pesagens?on_conflict=id',{method:'POST',body:{...payload,id:draftId,operacao_id:o.id,usuario_id:selectedUser},prefer:'resolution=ignore-duplicates,return=representation'});
    }
  };
  if(!isPlt){
    return await trySave(body);
  }
  // Para PALLET: salva metadados (incluindo criada_em e horario exatos) na ponte da suíte e tenta gravar tipo PALLET nativo; se o banco tiver check constraint legado, usa fallback transparente sem perder AWB/volumes/peso/horário!
  const recId=edit||draftId;
  const existingRec=edit?o.records?.find(r=>r.id===edit):null;
  const createdIso=existingRec?.created||new Date().toISOString();
  const createdTime=existingRec?.time||showTime(createdIso);
  const metaPayload={id:recId,operacao_id:o.id,dest:chosen,vol,kg:body.peso_kg,awb,user:state.name||'Usuário',criada_em:createdIso,horario:createdTime,updatedAt:new Date().toISOString()};
  await savePalletMetaForOp(o.id,recId,metaPayload);
  let savedRes;
  try{
    savedRes=await trySave({destino:chosen,volumes:vol,peso_kg:body.peso_kg,tipo:'PALLET',awb,...(hasCategories?{categoria:'PALLET'}:{})});
  }catch(e1){
    try{
      savedRes=await trySave({destino:chosen,volumes:vol,peso_kg:body.peso_kg,tipo:'NORMAL',awb:'PALLET:'+awb,...(hasCategories?{categoria:'CAIXA'}:{})});
    }catch(e2){
      savedRes=await trySave({destino:chosen,volumes:vol,peso_kg:body.peso_kg,tipo:'NORMAL',awb:null,...(hasCategories?{categoria:'CAIXA'}:{})});
    }
  }
  if(Array.isArray(savedRes)&&savedRes[0]&&savedRes[0].criada_em){
    await savePalletMetaForOp(o.id,savedRes[0].id||recId,{...metaPayload,id:savedRes[0].id||recId,criada_em:savedRes[0].criada_em,horario:showTime(savedRes[0].criada_em)});
  }
  return savedRes;
}

async function startCamera(){const token=++cameraEpoch,status=$('#cameraStatus');if(!navigator.mediaDevices?.getUserMedia||!window.AwbScanner){status.textContent='Abra no Safari ou Chrome e permita a câmera. Você também pode digitar a AWB.';return}try{const current=new AwbScanner($('#camera'),{controls:$('#cameraControls'),onStatus:message=>{if(token===cameraEpoch)status.textContent=message},onRead:codes=>{if(token!==cameraEpoch)return true;const matches=[...new Set(codes.map(extractAwb).filter(Boolean))];if(matches.length>1){status.textContent='Há mais de uma AWB na imagem. Aponte para apenas um volume.';return false}if(!matches.length)return false;$('#awbInput').value=matches[0];status.textContent='AWB lida. Confira os 12 dígitos e toque em OK.';playScanBeep();navigator.vibrate?.(60);stopCamera();return true}});reader=current;await current.start();if(token!==cameraEpoch)current.stop()}catch(e){if(token!==cameraEpoch)return;stopCamera();status.textContent=e.name==='NotAllowedError'?'Câmera não autorizada. Permita o acesso no Safari/Chrome ou digite a AWB.':'Não foi possível abrir a câmera. Toque em Ler novamente ou digite a AWB.'}}
async function readAwbPhoto(event){const file=event.target.files?.[0];if(!file)return;stopCamera();const token=cameraEpoch,status=$('#cameraStatus'),button=$('#readPhoto');button.disabled=true;status.textContent='Analisando a foto…';try{const codes=await AwbDecode.photo(file);if(token!==cameraEpoch||!scanning)return;const matches=[...new Set(codes.map(extractAwb).filter(Boolean))];if(matches.length===1){$('#awbInput').value=matches[0];playScanBeep();status.textContent='AWB lida na foto. Confira os 12 dígitos e confirme.'}else status.textContent=matches.length>1?'A foto contém mais de uma AWB. Fotografe apenas uma etiqueta.':'Não consegui reconhecer a AWB nesta foto. Envie essa foto no chat para verificarmos.'}catch(e){if(token===cameraEpoch)status.textContent=e.message||'Não foi possível ler a foto.'}finally{button.disabled=false;event.target.value=''}}

function excelBrazilDate(value){const parts=new Intl.DateTimeFormat('en-US',{timeZone:'America/Sao_Paulo',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hourCycle:'h23'}).formatToParts(new Date(value));const p=Object.fromEntries(parts.map(x=>[x.type,x.value]));return new Date(Date.UTC(+p.year,+p.month-1,+p.day,+p.hour,+p.minute,+p.second))}
function buildExportWorkbook(o,Excel){const book=new Excel.Workbook();book.creator='Sistema Aéreo - Gestão de Pesos';book.created=new Date();const meta=book.addWorksheet('OPERACAO');meta.columns=[{header:'CAMPO',key:'campo',width:24},{header:'VALOR',key:'valor',width:60}];meta.addRows([{campo:'VERSAO_LAYOUT',valor:3},{campo:'OPERACAO_ID',valor:o.id},{campo:'NOME',valor:o.nome},{campo:'DATA_OPERACAO',valor:new Date(o.data_operacao+'T12:00:00Z')},{campo:'STATUS',valor:o.status},{campo:'GERADO_EM',valor:excelBrazilDate(new Date())},{campo:'VOLUMES_TOTAL',valor:sum(o.records).vol},{campo:'PESO_TOTAL_KG',valor:sum(o.records).kg}]);meta.getCell('B5').numFmt='dd/mm/yyyy';meta.getCell('B7').numFmt='dd/mm/yyyy hh:mm:ss';meta.getCell('B9').numFmt='0.000';const summary=book.addWorksheet('RESUMO');summary.columns=[{header:'DESTINO',key:'dest',width:23},{header:'TIPO',key:'tipo',width:13},{header:'VOLUMES',key:'vol',width:14},{header:'PESO_KG',key:'kg',width:16}];for(const [dest] of grouped(o.records)){for(const tipo of CATEGORY_ORDER){const records=o.records.filter(r=>r.dest===dest&&recordKind(r)===tipo);if(records.length)summary.addRow({dest,tipo,...sum(records)})}}summary.getColumn('kg').numFmt='0.000';const dg=book.addWorksheet('DG');dg.columns=[{header:'AWB',key:'awb',width:20},{header:'DESTINO',key:'dest',width:23},{header:'VOLUMES',key:'vol',width:13},{header:'PESO_KG',key:'kg',width:15},{header:'USUARIO',key:'user',width:20},{header:'REGISTRADO_EM',key:'created',width:24}];for(const r of o.records.filter(r=>r.dg))dg.addRow({awb:String(r.awb),dest:r.dest,vol:1,kg:r.kg,user:r.user,created:excelBrazilDate(r.created)});dg.getColumn('awb').numFmt='@';dg.getColumn('kg').numFmt='0.000';dg.getColumn('created').numFmt='dd/mm/yyyy hh:mm:ss';const plt=book.addWorksheet('PALLET');plt.columns=[{header:'AWB',key:'awb',width:20},{header:'DESTINO',key:'dest',width:23},{header:'VOLUMES',key:'vol',width:13},{header:'PESO_KG',key:'kg',width:15},{header:'USUARIO',key:'user',width:20},{header:'REGISTRADO_EM',key:'created',width:24}];for(const r of o.records.filter(r=>r.pallet||recordKind(r)==='PALLET'))plt.addRow({awb:String(r.awb||''),dest:r.dest,vol:r.vol,kg:r.kg,user:r.user,created:excelBrazilDate(r.created)});plt.getColumn('awb').numFmt='@';plt.getColumn('kg').numFmt='0.000';plt.getColumn('created').numFmt='dd/mm/yyyy hh:mm:ss';const detail=book.addWorksheet('DETALHAMENTO');detail.columns=[{header:'DESTINO',key:'dest',width:23},{header:'TIPO',key:'category',width:20},{header:'VOLUMES',key:'vol',width:14},{header:'PESO_KG',key:'kg',width:16},{header:'HORARIO',key:'time',width:14},{header:'AWB',key:'awb',width:20},{header:'USUARIO',key:'user',width:18},{header:'REGISTRADO_EM',key:'created',width:22}];for(const r of o.records){detail.addRow({dest:r.dest,category:recordKind(r),vol:r.vol,kg:r.kg,time:r.time||showTime(r.created),awb:String(r.awb||''),user:r.user||'',created:r.created?excelBrazilDate(r.created):''})}detail.getColumn('kg').numFmt='0.000';detail.getColumn('awb').numFmt='@';detail.getColumn('created').numFmt='dd/mm/yyyy hh:mm:ss';for(const sheet of book.worksheets){sheet.views=[{state:'frozen',ySplit:1}];sheet.getRow(1).height=27;sheet.getRow(1).eachCell(cell=>{cell.font={bold:true,color:{argb:'FFFFFFFF'}};cell.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FF059669'}};cell.alignment={vertical:'middle'}});sheet.autoFilter={from:{row:1,column:1},to:{row:Math.max(1,sheet.rowCount),column:sheet.columnCount}}}return book}
let excelPromise;
function loadExcel(){if(window.ExcelJS)return Promise.resolve(window.ExcelJS);if(!excelPromise)excelPromise=new Promise((resolve,reject)=>{const script=document.createElement('script');script.src='https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js';script.onload=()=>resolve(window.ExcelJS);script.onerror=()=>{const fallback=document.createElement('script');fallback.src='/exceljs.min.js';fallback.onload=()=>resolve(window.ExcelJS);fallback.onerror=()=>{excelPromise=null;reject(Error('Não foi possível carregar o exportador Excel. Tente novamente.'))};document.head.append(fallback)};document.head.append(script)});return excelPromise}
async function exportExcel(){const button=$('#export'),id=active;button.disabled=true;button.textContent='Gerando Excel…';try{const Excel=await loadExcel();await loadOperations();if(!state.ops.some(o=>o.id===id))throw Error('Operação não encontrada.');await loadRecords(id);const o=state.ops.find(o=>o.id===id);const latest=await api(`operacoes?select=atualizada_em&id=eq.${id}`);if(!latest.length||latest[0].atualizada_em!==o.atualizada_em)throw Error('O estado da operação mudou durante a exportação. Tente novamente.');const book=buildExportWorkbook(o,Excel),buffer=await book.xlsx.writeBuffer(),blob=new Blob([buffer],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}),url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download=`PESOS_${o.data_operacao}_${o.id.slice(0,8)}.xlsx`;document.body.append(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);toast(o.status==='FINALIZADA'?'Excel gerado com os dados da operação.':'Excel parcial gerado. A operação ainda está aberta.')}catch(e){toast(errorMessage(e))}finally{safeRender()}}
